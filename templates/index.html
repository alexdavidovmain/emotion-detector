<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emotion Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0a0a0a;--surface:#111;--surface2:#191919;--border:#2a2a2a;--text:#f0ede8;--muted:#888;--accent:#c8f060;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
  h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3rem);font-weight:800;margin-bottom:0.5rem;text-align:center;}
  h1 span{color:var(--accent);}
  .subtitle{color:var(--muted);margin-bottom:2rem;text-align:center;}
  .video-wrap{position:relative;border:1px solid var(--border);border-radius:16px;overflow:hidden;max-width:640px;width:100%;}
  .video-wrap img{width:100%;display:block;}
  .emotion-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem 2rem;margin-top:1.5rem;display:flex;align-items:center;gap:1.5rem;max-width:640px;width:100%;}
  .emotion-label{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--accent);text-transform:capitalize;min-width:160px;}
  .confidence{color:var(--muted);font-size:0.9rem;}
  .emojis{display:flex;gap:0.75rem;margin-top:1.5rem;}
  .emoji-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.6rem 1rem;font-size:0.85rem;color:var(--muted);display:flex;align-items:center;gap:0.4rem;}
  .emoji-card.active{border-color:rgba(200,240,96,0.5);color:var(--accent);}
</style>
</head>
<body>
<h1>Emotion <span>Detector</span></h1>
<p class="subtitle">Real-time facial emotion recognition powered by deep learning.</p>

<div class="video-wrap">
  <img src="/video" alt="webcam feed"/>
</div>

<div class="emotion-bar">
  <div class="emotion-label" id="emotionLabel">detecting...</div>
  <div class="confidence" id="confidenceLabel">confidence: —</div>
</div>

<div class="emojis">
  <div class="emoji-card" data-emotion="happy">😊 happy</div>
  <div class="emoji-card" data-emotion="sad">😢 sad</div>
  <div class="emoji-card" data-emotion="angry">😠 angry</div>
  <div class="emoji-card" data-emotion="surprise">😲 surprise</div>
  <div class="emoji-card" data-emotion="fear">😨 fear</div>
  <div class="emoji-card" data-emotion="neutral">😐 neutral</div>
  <div class="emoji-card" data-emotion="disgust">🤢 disgust</div>
</div>

<script>
  async function poll() {
    try {
      const res = await fetch('/emotion');
      const data = await res.json();
      document.getElementById('emotionLabel').textContent = data.emotion;
      document.getElementById('confidenceLabel').textContent = `confidence: ${data.confidence}%`;
      document.querySelectorAll('.emoji-card').forEach(c => {
        c.classList.toggle('active', c.dataset.emotion === data.emotion);
      });
    } catch(e){}
    setTimeout(poll, 800);
  }
  poll();
</script>
</body>
</html>
